<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>亏死了么 — 极简原型</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>亏死了么</h1>
    <p class="subtitle">今天是赚了还是亏了？</p>
    <div class="buttons">
      <button id="profit" class="btn profit">赚了</button>
      <button id="loss" class="btn loss">亏了</button>
    </div>

    <div class="note">可选币种：
      <select id="currency-select">
        <option value="USD">USD</option>
        <option value="USDT">USDT</option>
        <option value="CNY">CNY</option>
        <option value="BTC">BTC</option>
        <option value="ETH">ETH</option>
        <option value="EUR">EUR</option>
      </select>
    </div>

    <section id="panel">
      <h2>排行榜（地区）</h2>
      <div id="leaderboard">加载中…</div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-title">记录</h3>
      <label>损益金额 <input id="amount" type="number" step="0.00000001" value="0" /></label>
      <div class="conversion">等于 <span id="amount-usd">0</span> USD</div>
      <label>所属地区
        <select id="region">
          <option value="unknown">自动/未知</option>
          <option value="CN">中国</option>
          <option value="US">美国</option>
          <option value="HK">香港</option>
          <option value="EU">欧洲</option>
        </select>
      </label>
      <label><input id="alive" type="checkbox" checked /> 我还活着</label>
      <div class="modal-actions">
        <button id="submit">提交</button>
        <button id="cancel">取消</button>
      </div>
    </div>
  </div>

  <div id="privacy" class="privacy">
    <a href="#" id="privacy-link">隐私说明 / 删除记录</a>
  </div>

  <script src="app.js"></script>
</body>
</html>
